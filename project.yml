name: Jot
options:
  bundleIdPrefix: com.alexkovalev
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FKB54TC53B
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 1.10.0
targets:
  Jot:
    type: application
    platform: macOS
    sources: [Jot, Shared]
    dependencies:
      - package: KeyboardShortcuts
      - target: JotWidget
    entitlements:
      path: Jot/Jot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups: [FKB54TC53B.com.alexkovalev.jot]
    info:
      path: Jot/Info.plist
      properties:
        CFBundleDisplayName: Jot
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Alex Kovalev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexkovalev.jot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
  JotWidget:
    type: app-extension
    platform: macOS
    sources: [JotWidget, Shared]
    entitlements:
      path: JotWidget/JotWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [FKB54TC53B.com.alexkovalev.jot]
    info:
      path: JotWidget/Info.plist
      properties:
        CFBundleDisplayName: Jot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexkovalev.jot.widget
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
